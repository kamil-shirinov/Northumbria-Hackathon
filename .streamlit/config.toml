[theme]
base = "light"
# Contrast against white: primary 5.3:1 (needs 4.5:1). The darker text colour also lifts captions, which
# Streamlit draws at 60% of the text colour, from about 3.7:1 to 4.7:1.
primaryColor = "#0b6bcb"
textColor = "#111827"

[client]
# "none": the page shows only a generic message when something breaks. Details still print in the terminal.
showErrorDetails = "none"

[browser]
gatherUsageStats = false
